[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sampler-autoresearch"
version = "0.1.0"
description = "Frozen-model sampler autoresearch for EDM CIFAR-10."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchvision",
  "numpy",
  "scipy",
  "pillow",
  "tqdm",
  "click",
  "requests",
  "pyyaml",
  "matplotlib",
  "huggingface_hub",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
